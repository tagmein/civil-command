<!doctype html>
<html>
 <head>
  <style>
   :root {
    background-color: black;
    box-sizing: border-box;
    color: white;
    display: grid;
    min-height: 100dvh;
    min-width: 100%;
    overflow: auto;
    padding: 1em;
    width: fit-content;
   }
   body {
    box-sizing: border-box;
    margin: auto;
    padding: 0.75em 1em;
    min-height: 1em;
    min-width: 1em;
    width: max-content;
    border-radius: 1em;
    border: 1px solid #20202020;
    box-shadow: 0 0 0.25em #00000040, inset -2px -2px 2px #ffffff08, inset -1px -1px 1px #ffffff08, inset 4px 4px 4px #00000020, inset 2px 2px 2px #00000040;
   }
   
   body * {
    white-space: pre-wrap;
   }
   
   body *::selection {
    background: #ffffff80;
    color: black;
   }

   .lanes-table {
    border-collapse: collapse;
   }

   .lanes-table thead th {
    vertical-align: top;
   }

   .lanes-table thead th:first-child {
    padding: 0;
   }

   .lane-controls {
    display: flex;
    gap: 0.35em;
    padding: 0.25em 0.5em 0.25em 0;
    white-space: nowrap;
   }

   .lane-control-btn {
    align-items: center;
    background: #ffffff0e;
    border: 1px solid #ffffff24;
    border-radius: 4px;
    box-sizing: border-box;
    color: white;
    cursor: pointer;
    display: inline-flex;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    justify-content: center;
    line-height: 1.25;
    padding: 0.3em 0.65em;
    white-space: nowrap;
   }

   .lane-control-btn:hover,
   .lane-control-btn:focus {
    background: #ffffff1e;
    border-color: #ffffff48;
   }

   .lane-config-btn {
    flex-shrink: 0;
    min-height: calc(1.25em + 0.6em + 2px);
    padding: 0.3em 0.5em;
   }

   .lane-config-icon {
    display: block;
    height: 1.05em;
    width: 1.05em;
   }

   .lane-header {
    border-bottom: 1px solid #ffffff18;
    border-left: 1px solid #ffffff12;
    min-width: 24em;
   }

   .lane-header-top {
    align-items: flex-start;
    display: flex;
    gap: 0.6em;
    justify-content: space-between;
    white-space: normal;
   }

   .lane-header-meta {
    flex: 1;
    min-width: 0;
   }

   .lane-close-btn {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 4px;
    color: #ffffff88;
    cursor: pointer;
    flex-shrink: 0;
    font-family: "IBM Plex Mono", monospace;
    font-size: 14px;
    line-height: 1;
    opacity: 0.55;
    padding: 0.15em 0.35em;
    white-space: nowrap;
   }

   .lane-close-btn:hover,
   .lane-close-btn:focus {
    background: #ff555524;
    border-color: #ff555550;
    color: #ff9c9c;
    opacity: 1;
   }

   .lane-body {
    border-left: 1px solid #ffffff12;
    padding: 0.4em 0.5em 0.75em;
    vertical-align: top;
   }

   .lane-notebook {
    display: flex;
    flex-direction: column;
    gap: 0.3em;
    min-width: 24em;
   }

   .lane-lines {
    display: flex;
    flex-direction: column;
    gap: 0.25em;
   }

   .lane-line {
    align-items: center;
    display: grid;
    gap: 0.4em;
    grid-template-columns: 1.75em minmax(13em, 1fr) minmax(8em, auto) 1.5em;
    white-space: normal;
   }

   .lane-line-num {
    color: #ffffff60;
    font-size: 11px;
    text-align: right;
    user-select: none;
   }

   .lane-line-input {
    background: #ffffff08;
    border: 1px solid #ffffff16;
    border-radius: 4px;
    color: white;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    outline: none;
    padding: 0.25em 0.45em;
    white-space: pre;
   }

   .lane-line-input:focus {
    background: #ffffff10;
    border-color: #ffffff44;
   }

   .lane-line-preview {
    background: #00000040;
    border-radius: 4px;
    color: #9ce5ff;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    max-width: 18em;
    overflow: hidden;
    padding: 0.25em 0.45em;
    text-overflow: ellipsis;
    white-space: nowrap;
   }

   .lane-line-preview:empty {
    background: transparent;
    padding: 0;
   }

   .lane-line-preview--error {
    color: #ff8a8a;
   }

   .lane-line-preview--comment {
    color: #ffffff48;
   }

   .lane-line-remove,
   .lane-add-line {
    background: transparent;
    border: 1px solid #ffffff1c;
    border-radius: 4px;
    color: #ffffff90;
    cursor: pointer;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    line-height: 1;
    padding: 0.25em 0.4em;
    white-space: nowrap;
   }

   .lane-line-remove {
    border-color: transparent;
    opacity: 0.45;
   }

   .lane-line-remove:hover,
   .lane-line-remove:focus {
    background: #ff555524;
    border-color: #ff555550;
    color: #ff9c9c;
    opacity: 1;
   }

   .lane-add-line {
    align-self: flex-start;
    margin-left: 2.15em;
    margin-top: 0.15em;
   }

   .lane-add-line:hover,
   .lane-add-line:focus {
    background: #ffffff14;
    border-color: #ffffff38;
    color: white;
   }

   .lane-modal-backdrop {
    align-items: stretch;
    backdrop-filter: blur(6px);
    background: #000000d8;
    box-sizing: border-box;
    display: flex;
    inset: 0;
    justify-content: center;
    padding: 1.5em;
    position: fixed;
    white-space: normal;
    z-index: 1000;
   }

   .lane-modal {
    background: #1b1b1b;
    border: 1px solid #ffffff1e;
    border-radius: 12px;
    box-shadow: 0 24px 64px #000000b0;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 0.85em;
    height: 100%;
    max-width: 60em;
    overflow: hidden;
    padding: 1.25em 1.5em;
    white-space: normal;
    width: 100%;
   }

   .lane-modal-header {
    align-items: center;
    display: flex;
    justify-content: space-between;
    white-space: normal;
   }

   .lane-modal-title-wrap {
    align-items: baseline;
    display: flex;
    gap: 0.75em;
    white-space: normal;
   }

   .lane-modal-title {
    font-size: 16px;
    font-weight: bold;
   }

   .lane-modal-count {
    color: #ffffff66;
    font-size: 12px;
   }

   .lane-modal-close {
    background: transparent;
    border: 1px solid #ffffff1e;
    border-radius: 6px;
    color: #ffffffa8;
    cursor: pointer;
    font-family: "IBM Plex Mono", monospace;
    font-size: 16px;
    line-height: 1;
    padding: 0.25em 0.55em;
    white-space: nowrap;
   }

   .lane-modal-close:hover,
   .lane-modal-close:focus {
    background: #ffffff14;
    border-color: #ffffff44;
    color: white;
   }

   .lane-modal-search {
    background: #ffffff0a;
    border: 1px solid #ffffff1f;
    border-radius: 6px;
    box-sizing: border-box;
    color: white;
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    outline: none;
    padding: 0.55em 0.75em;
    white-space: pre;
    width: 100%;
   }

   .lane-modal-search:focus {
    background: #ffffff12;
    border-color: #ffffff48;
   }

   .lane-modal-list {
    display: flex;
    flex: 1;
    flex-direction: column;
    gap: 0.45em;
    overflow-y: auto;
    padding-right: 0.25em;
    white-space: normal;
   }

   .lane-modal-empty {
    color: #ffffff66;
    padding: 2em 0;
    text-align: center;
   }

   .lane-modal-item {
    align-items: center;
    background: #ffffff07;
    border: 1px solid #ffffff14;
    border-radius: 8px;
    display: flex;
    gap: 1em;
    justify-content: space-between;
    padding: 0.65em 0.9em;
    white-space: normal;
   }

   .lane-modal-item:hover {
    background: #ffffff0d;
    border-color: #ffffff28;
   }

   .lane-modal-item-info {
    min-width: 0;
   }

   .lane-modal-item-title {
    font-size: 13px;
    font-weight: bold;
   }

   .lane-modal-item-id {
    color: #ffffff66;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    margin-top: 0.15em;
   }

   .lane-modal-item-actions {
    align-items: center;
    display: flex;
    flex-shrink: 0;
    gap: 0.5em;
    white-space: nowrap;
   }

   .lane-modal-badge {
    background: #38d39f22;
    border: 1px solid #38d39f55;
    border-radius: 999px;
    color: #7df3c8;
    font-size: 11px;
    padding: 0.15em 0.6em;
    white-space: nowrap;
   }

   .lane-modal-action {
    background: #ffffff10;
    border: 1px solid #ffffff28;
    border-radius: 6px;
    color: white;
    cursor: pointer;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    padding: 0.35em 0.75em;
    white-space: nowrap;
   }

   .lane-modal-action--open:hover,
   .lane-modal-action--open:focus {
    background: #9ce5ff26;
    border-color: #9ce5ff66;
    color: #d6f5ff;
   }

   .lane-modal-action--close {
    background: transparent;
    color: #ffffff99;
   }

   .lane-modal-action--close:hover,
   .lane-modal-action--close:focus {
    background: #ff555524;
    border-color: #ff555550;
    color: #ff9c9c;
   }

   .lane-config-backdrop {
    align-items: center;
   }

   .lane-config-modal {
    height: auto;
    max-width: 32em;
   }

   .lane-config-title-wrap {
    display: flex;
    flex-direction: column;
    gap: 0.2em;
    min-width: 0;
    white-space: normal;
   }

   .lane-config-id {
    color: #ffffff66;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    overflow-wrap: anywhere;
   }

   .lane-config-form {
    display: flex;
    flex-direction: column;
    gap: 1em;
    margin: 0;
    white-space: normal;
   }

   .lane-config-field {
    display: flex;
    flex-direction: column;
    gap: 0.4em;
    white-space: normal;
   }

   .lane-config-label {
    color: #ffffffb0;
    font-size: 12px;
   }

   .lane-config-input {
    background: #ffffff0a;
    border: 1px solid #ffffff1f;
    border-radius: 6px;
    box-sizing: border-box;
    color: white;
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    outline: none;
    padding: 0.55em 0.75em;
    white-space: pre;
    width: 100%;
   }

   .lane-config-input:focus {
    background: #ffffff12;
    border-color: #ffffff48;
   }

   .lane-config-footer {
    display: flex;
    gap: 0.5em;
    justify-content: flex-end;
    white-space: normal;
   }

   .lane-config-btn--cancel {
    background: transparent;
    color: #ffffff99;
   }

   .lane-config-btn--cancel:hover,
   .lane-config-btn--cancel:focus {
    background: #ffffff10;
    border-color: #ffffff38;
    color: white;
   }

   .lane-config-btn--save {
    background: #9ce5ff1f;
    border-color: #9ce5ff55;
    color: #d6f5ff;
   }

   .lane-config-btn--save:hover,
   .lane-config-btn--save:focus {
    background: #9ce5ff33;
    border-color: #9ce5ff88;
    color: white;
   }
  </style>
  <script type="module" src="/field.mjs"></script>
 </head>
 <body>
  <script type="module">
   import { field, runLines } from '/field.mjs'
   import { data } from '/data.mjs'
   const main = globalThis.main = field({
    console,
    data,
    document,
    runLines
   })
   await main.load('/src/main.fs')
  </script>
 </body>
</html>
