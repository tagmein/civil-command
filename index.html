<!doctype html>
<html>
 <head>
  <style>
   :root {
    background-color: black;
    box-sizing: border-box;
    color: white;
    display: grid;
    min-height: 100dvh;
    min-width: 100%;
    overflow: auto;
    padding: 1em;
    width: fit-content;
   }
   body {
    box-sizing: border-box;
    margin: auto;
    padding: 0.75em 1em;
    min-height: 1em;
    min-width: 1em;
    width: max-content;
    border-radius: 1em;
    border: 1px solid #20202020;
    box-shadow: 0 0 0.25em #00000040, inset -2px -2px 20px #ffffff04, inset -1px -1px 10px #ffffff08, inset 4px 4px 4px #00000080, inset 2px 2px 2px #00000040;
   }
   
   body * {
    white-space: pre-wrap;
   }
   
   body *::selection {
    background: #ffffff80;
    color: black;
   }

   .lanes-table {
    border-collapse: collapse;
   }

   .lanes-table thead th {
    vertical-align: top;
   }

   .lanes-table thead th:first-child {
    padding: 0;
   }

   .lane-controls {
    display: flex;
    gap: 0.35em;
    padding: 0.25em 0.5em 0.25em 0;
    white-space: nowrap;
   }

   .lane-control-btn {
    align-items: center;
    background: #ffffff0e;
    border: 1px solid #ffffff24;
    border-radius: 4px;
    box-sizing: border-box;
    color: white;
    cursor: pointer;
    display: inline-flex;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    justify-content: center;
    line-height: 1.25;
    padding: 0.3em 0.65em;
    white-space: nowrap;
   }

   .lane-control-btn:hover,
   .lane-control-btn:focus {
    background: #ffffff1e;
    border-color: #ffffff48;
   }

   .lane-config-btn {
    flex-shrink: 0;
    min-height: calc(1.25em + 0.6em + 2px);
    padding: 0.3em 0.5em;
   }

   .lane-config-icon {
    display: block;
    height: 1.05em;
    width: 1.05em;
   }

   .lane-header {
    border-bottom: 1px solid #ffffff18;
    border-left: 1px solid #ffffff12;
    min-width: 24em;
   }

   .lane-header-top {
    align-items: flex-start;
    display: flex;
    gap: 0.45em;
    justify-content: space-between;
    white-space: normal;
   }

   .lane-header-meta {
    flex: 1;
    min-width: 0;
   }

   .lane-reload-btn,
   .lane-close-btn {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 4px;
    color: #ffffff88;
    cursor: pointer;
    flex-shrink: 0;
    font-family: "IBM Plex Mono", monospace;
    font-size: 14px;
    line-height: 1;
    opacity: 0.55;
    padding: 0.15em 0.35em;
    white-space: nowrap;
   }

   .lane-reload-btn:hover,
   .lane-reload-btn:focus {
    background: #9ce5ff1e;
    border-color: #9ce5ff50;
    color: #d6f5ff;
    opacity: 1;
   }

   .lane-close-btn:hover,
   .lane-close-btn:focus {
    background: #ff555524;
    border-color: #ff555550;
    color: #ff9c9c;
    opacity: 1;
   }

   .lane-body {
    border-left: 1px solid #ffffff12;
    padding: 0.4em 0.5em 0.75em;
    vertical-align: top;
   }

   .lane-notebook {
    display: flex;
    flex-direction: column;
    gap: 0.4em;
    min-width: 24em;
   }

   .lane-tabs {
    border-bottom: 1px solid #ffffff18;
    display: flex;
    gap: 0.25em;
    margin-bottom: 0.1em;
    padding-bottom: 0.25em;
    white-space: nowrap;
   }

   .lane-tab {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 4px;
    color: #ffffff80;
    cursor: pointer;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    line-height: 1.25;
    padding: 0.25em 0.6em;
    white-space: nowrap;
   }

   .lane-tab:hover,
   .lane-tab:focus {
    background: #ffffff10;
    color: white;
   }

   .lane-tab--active {
    background: #9ce5ff1a;
    border-color: #9ce5ff44;
    color: #d6f5ff;
   }

   .lane-tab-panel {
    display: flex;
    flex-direction: column;
    gap: 0.3em;
    white-space: normal;
   }

   .lane-tab-panel[hidden],
   .lane-inputs-empty[hidden] {
    display: none;
   }

   .lane-inputs {
    display: flex;
    flex-direction: column;
    gap: 0.35em;
    white-space: normal;
   }

   .lane-inputs-table {
    border-collapse: collapse;
    width: 100%;
    white-space: normal;
   }

   .lane-inputs-th {
    border-bottom: 1px solid #ffffff16;
    color: #ffffff78;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    font-weight: normal;
    padding: 0.2em 0.35em 0.3em;
    text-align: left;
    white-space: nowrap;
   }

   .lane-inputs-th--actions {
    width: 1.8em;
   }

   .lane-input-cell {
    padding: 0.2em 0.25em 0.2em 0;
    vertical-align: middle;
    white-space: normal;
   }

   .lane-input-cell--actions {
    padding-right: 0;
    text-align: right;
   }

   .lane-input-name,
   .lane-input-type {
    background: #ffffff08;
    border: 1px solid #ffffff16;
    border-radius: 4px;
    box-sizing: border-box;
    color: white;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    outline: none;
    padding: 0.25em 0.45em;
    width: 100%;
   }

   .lane-input-name {
    white-space: pre;
   }

   .lane-input-type {
    background-color: #1c1c1c;
    cursor: pointer;
    min-width: 7.5em;
    white-space: nowrap;
   }

   .lane-input-type option {
    background-color: #1c1c1c;
    color: white;
   }

   .lane-input-name:focus,
   .lane-input-type:focus {
    background-color: #252525;
    border-color: #ffffff44;
   }

   .lane-inputs-empty {
    color: #ffffff58;
    font-size: 11px;
    padding: 0.35em 0.25em;
    white-space: normal;
   }

   .lane-input-remove,
   .lane-add-input {
    background: transparent;
    border: 1px solid #ffffff1c;
    border-radius: 4px;
    color: #ffffff90;
    cursor: pointer;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    line-height: 1;
    padding: 0.25em 0.45em;
    white-space: nowrap;
   }

   .lane-input-remove {
    border-color: transparent;
    opacity: 0.45;
   }

   .lane-input-remove:hover,
   .lane-input-remove:focus {
    background: #ff555524;
    border-color: #ff555550;
    color: #ff9c9c;
    opacity: 1;
   }

   .lane-add-input {
    align-self: flex-start;
    margin-top: 0.1em;
   }

   .lane-add-input:hover,
   .lane-add-input:focus {
    background: #ffffff14;
    border-color: #ffffff38;
    color: white;
   }

   .lane-scope {
    display: flex;
    flex-direction: column;
    gap: 0.35em;
    white-space: normal;
   }

   .lane-scope-breadcrumb {
    align-items: center;
    background: #ffffff07;
    border: 1px solid #ffffff14;
    border-radius: 5px;
    display: flex;
    flex-wrap: wrap;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    gap: 0.1em;
    padding: 0.25em 0.45em;
    white-space: normal;
   }

   .lane-scope-crumb {
    background: transparent;
    border: none;
    border-radius: 3px;
    color: #9ce5ff;
    cursor: pointer;
    font-family: inherit;
    font-size: inherit;
    padding: 0.1em 0.25em;
    white-space: nowrap;
   }

   .lane-scope-crumb:hover,
   .lane-scope-crumb:focus {
    background: #9ce5ff1f;
    color: #d6f5ff;
   }

   .lane-scope-crumb-sep {
    color: #ffffff55;
    user-select: none;
    white-space: pre;
   }

   .lane-scope-columns {
    background: #00000038;
    border: 1px solid #ffffff16;
    border-radius: 6px;
    display: flex;
    flex-direction: row;
    max-height: 22em;
    max-width: 44em;
    min-height: 11em;
    overflow-x: auto;
    overflow-y: hidden;
    white-space: normal;
   }

   .lane-scope-col {
    border-right: 1px solid #ffffff14;
    box-sizing: border-box;
    display: flex;
    flex: 0 0 auto;
    flex-direction: column;
    max-height: 22em;
    max-width: 16em;
    min-width: 11.5em;
    white-space: normal;
   }

   .lane-scope-col:last-child {
    border-right: none;
   }

   .lane-scope-col--value {
    max-width: 22em;
    min-width: 13em;
   }

   .lane-scope-col-header {
    align-items: center;
    background: #ffffff08;
    border-bottom: 1px solid #ffffff14;
    display: flex;
    flex-shrink: 0;
    gap: 0.4em;
    justify-content: space-between;
    padding: 0.3em 0.55em;
    white-space: nowrap;
   }

   .lane-scope-col-title {
    color: #ffffffd8;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    font-weight: bold;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
   }

   .lane-scope-col-meta,
   .lane-scope-type-badge {
    background: #ffffff10;
    border-radius: 3px;
    color: #ffffff88;
    flex-shrink: 0;
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    padding: 0.1em 0.35em;
    white-space: nowrap;
   }

   .lane-scope-type-badge {
    background: #9ce5ff1a;
    color: #9ce5ff;
   }

   .lane-scope-col-banner {
    background: #00000030;
    border-bottom: 1px solid #ffffff10;
    color: #9ce5ff;
    flex-shrink: 0;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    overflow: hidden;
    padding: 0.25em 0.55em;
    text-overflow: ellipsis;
    white-space: nowrap;
   }

   .lane-scope-list {
    display: flex;
    flex: 1;
    flex-direction: column;
    overflow-y: auto;
    padding: 0.2em 0;
    white-space: normal;
   }

   .lane-scope-empty {
    color: #ffffff55;
    font-size: 11px;
    padding: 0.5em 0.6em;
    white-space: normal;
   }

   .lane-scope-divider {
    border-top: 1px solid #ffffff12;
    color: #ffffff44;
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    margin-top: 0.25em;
    padding: 0.25em 0.55em 0.15em;
    text-transform: uppercase;
    user-select: none;
    white-space: nowrap;
   }

   .lane-scope-item {
    align-items: center;
    background: transparent;
    border: none;
    color: #ffffffde;
    cursor: pointer;
    display: flex;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    gap: 0.5em;
    justify-content: space-between;
    padding: 0.24em 0.55em;
    text-align: left;
    white-space: nowrap;
    width: 100%;
   }

   .lane-scope-item:hover,
   .lane-scope-item:focus {
    background: #ffffff10;
    outline: none;
   }

   .lane-scope-item--nonenum {
    color: #ffffff9e;
   }

   .lane-scope-item--inherited {
    color: #ffffff74;
   }

   .lane-scope-item--selected,
   .lane-scope-item--selected:hover,
   .lane-scope-item--selected:focus {
    background: #9ce5ff24;
    color: #d6f5ff;
   }

   .lane-scope-item-key {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
   }

   .lane-scope-item-right {
    align-items: center;
    display: inline-flex;
    flex-shrink: 0;
    gap: 0.25em;
    max-width: 7.5em;
    white-space: nowrap;
   }

   .lane-scope-item-hint {
    color: #ffffff62;
    font-size: 10px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
   }

   .lane-scope-item--selected .lane-scope-item-hint {
    color: #9ce5ffbb;
   }

   .lane-scope-item-arrow {
    color: #ffffff66;
    font-size: 10px;
   }

   .lane-scope-item--selected .lane-scope-item-arrow {
    color: #9ce5ff;
   }

   .lane-scope-value-box {
    display: flex;
    flex: 1;
    flex-direction: column;
    gap: 0.4em;
    overflow-y: auto;
    padding: 0.5em 0.6em;
    white-space: normal;
   }

   .lane-scope-value-path {
    color: #ffffff68;
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    overflow-wrap: anywhere;
    white-space: normal;
   }

   .lane-scope-value-code {
    background: #00000044;
    border: 1px solid #ffffff12;
    border-radius: 4px;
    color: #9ce5ff;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    margin: 0;
    overflow-wrap: anywhere;
    padding: 0.45em 0.55em;
    white-space: pre-wrap;
   }

   .lane-scope-value-code--error {
    color: #ff8a8a;
   }

   .lane-lines {
    display: flex;
    flex-direction: column;
    gap: 0.25em;
   }

   .lane-line {
    align-items: center;
    display: grid;
    gap: 0.4em;
    grid-template-columns: 1.75em minmax(13em, 1fr) minmax(8em, auto) 1.5em;
    white-space: normal;
   }

   .lane-line-num {
    color: #ffffff60;
    font-size: 11px;
    text-align: right;
    user-select: none;
   }

   .lane-line-input {
    background: #ffffff08;
    border: 1px solid #ffffff16;
    border-radius: 4px;
    color: white;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    outline: none;
    padding: 0.25em 0.45em;
    white-space: pre;
   }

   .lane-line-input:focus {
    background: #ffffff10;
    border-color: #ffffff44;
   }

   .lane-line-preview {
    background: #00000040;
    border-radius: 4px;
    color: #9ce5ff;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    max-width: 18em;
    overflow: hidden;
    padding: 0.25em 0.45em;
    text-overflow: ellipsis;
    white-space: nowrap;
   }

   .lane-line-preview:empty {
    background: transparent;
    padding: 0;
   }

   .lane-line-preview--error {
    color: #ff8a8a;
   }

   .lane-line-preview--comment {
    color: #ffffff48;
   }

   .lane-line-remove,
   .lane-add-line,
   .lane-add-import {
    background: transparent;
    border: 1px solid #ffffff1c;
    border-radius: 4px;
    color: #ffffff90;
    cursor: pointer;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    line-height: 1;
    padding: 0.25em 0.4em;
    white-space: nowrap;
   }

   .lane-line-remove {
    border-color: transparent;
    opacity: 0.45;
   }

   .lane-line-remove:hover,
   .lane-line-remove:focus {
    background: #ff555524;
    border-color: #ff555550;
    color: #ff9c9c;
    opacity: 1;
   }

   .lane-line-actions {
    display: flex;
    gap: 0.35em;
    margin-left: 2.15em;
    margin-top: 0.15em;
    white-space: nowrap;
   }

   .lane-add-line:hover,
   .lane-add-line:focus,
   .lane-add-import:hover,
   .lane-add-import:focus {
    background: #ffffff14;
    border-color: #ffffff38;
    color: white;
   }

   .lane-add-import {
    border-color: #9ce5ff33;
    color: #9ce5ffcc;
    font-size: 11px;
    padding: 0.25em 0.55em;
   }

   .lane-add-import:hover,
   .lane-add-import:focus {
    background: #9ce5ff1a;
    border-color: #9ce5ff66;
    color: #d6f5ff;
   }

   .lane-import-control {
    align-items: center;
    background: #9ce5ff0a;
    border: 1px solid #9ce5ff2c;
    border-radius: 4px;
    box-sizing: border-box;
    display: flex;
    gap: 0.35em;
    min-width: 0;
    padding: 0.15em 0.3em;
    white-space: nowrap;
   }

   .lane-import-alias {
    background: #ffffff0a;
    border: 1px solid #ffffff1a;
    border-radius: 3px;
    box-sizing: border-box;
    color: white;
    flex: 0 1 7.5em;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    min-width: 4em;
    outline: none;
    padding: 0.15em 0.35em;
    white-space: pre;
   }

   .lane-import-alias:focus {
    background: #ffffff14;
    border-color: #9ce5ff66;
   }

   .lane-import-arrow {
    color: #9ce5ff88;
    flex-shrink: 0;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    user-select: none;
   }

   .lane-import-pick-btn {
    background: #ffffff0c;
    border: 1px solid #ffffff20;
    border-radius: 3px;
    color: #ffffffaa;
    cursor: pointer;
    flex: 1 1 auto;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    min-width: 0;
    overflow: hidden;
    padding: 0.2em 0.45em;
    text-align: left;
    text-overflow: ellipsis;
    white-space: nowrap;
   }

   .lane-import-pick-btn:hover,
   .lane-import-pick-btn:focus {
    background: #9ce5ff1c;
    border-color: #9ce5ff55;
    color: white;
   }

   .lane-import-pick-btn--set {
    background: #9ce5ff16;
    border-color: #9ce5ff44;
    color: #d6f5ff;
   }

   .lane-modal-backdrop {
    align-items: stretch;
    backdrop-filter: blur(6px);
    background: #000000d8;
    box-sizing: border-box;
    display: flex;
    inset: 0;
    justify-content: center;
    padding: 1.5em;
    position: fixed;
    white-space: normal;
    z-index: 1000;
   }

   .lane-modal {
    background: #1b1b1b;
    border: 1px solid #ffffff1e;
    border-radius: 12px;
    box-shadow: 0 24px 64px #000000b0;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 0.85em;
    height: 100%;
    max-width: 60em;
    overflow: hidden;
    padding: 1.25em 1.5em;
    white-space: normal;
    width: 100%;
   }

   .lane-modal-header {
    align-items: center;
    display: flex;
    justify-content: space-between;
    white-space: normal;
   }

   .lane-modal-title-wrap {
    align-items: baseline;
    display: flex;
    gap: 0.75em;
    white-space: normal;
   }

   .lane-modal-title {
    font-size: 16px;
    font-weight: bold;
   }

   .lane-modal-count {
    color: #ffffff66;
    font-size: 12px;
   }

   .lane-modal-close {
    background: transparent;
    border: 1px solid #ffffff1e;
    border-radius: 6px;
    color: #ffffffa8;
    cursor: pointer;
    font-family: "IBM Plex Mono", monospace;
    font-size: 16px;
    line-height: 1;
    padding: 0.25em 0.55em;
    white-space: nowrap;
   }

   .lane-modal-close:hover,
   .lane-modal-close:focus {
    background: #ffffff14;
    border-color: #ffffff44;
    color: white;
   }

   .lane-modal-search {
    background: #ffffff0a;
    border: 1px solid #ffffff1f;
    border-radius: 6px;
    box-sizing: border-box;
    color: white;
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    outline: none;
    padding: 0.55em 0.75em;
    white-space: pre;
    width: 100%;
   }

   .lane-modal-search:focus {
    background: #ffffff12;
    border-color: #ffffff48;
   }

   .lane-modal-list {
    display: flex;
    flex: 1;
    flex-direction: column;
    gap: 0.45em;
    overflow-y: auto;
    padding-right: 0.25em;
    white-space: normal;
   }

   .lane-modal-empty {
    color: #ffffff66;
    padding: 2em 0;
    text-align: center;
   }

   .lane-modal-item {
    align-items: center;
    background: #ffffff07;
    border: 1px solid #ffffff14;
    border-radius: 8px;
    display: flex;
    gap: 1em;
    justify-content: space-between;
    padding: 0.65em 0.9em;
    white-space: normal;
   }

   .lane-modal-item:hover {
    background: #ffffff0d;
    border-color: #ffffff28;
   }

   .lane-modal-item-info {
    min-width: 0;
   }

   .lane-modal-item-title {
    font-size: 13px;
    font-weight: bold;
   }

   .lane-modal-item-id {
    color: #ffffff66;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    margin-top: 0.15em;
   }

   .lane-modal-item-actions {
    align-items: center;
    display: flex;
    flex-shrink: 0;
    gap: 0.5em;
    white-space: nowrap;
   }

   .lane-modal-badge {
    background: #38d39f22;
    border: 1px solid #38d39f55;
    border-radius: 999px;
    color: #7df3c8;
    font-size: 11px;
    padding: 0.15em 0.6em;
    white-space: nowrap;
   }

   .lane-modal-action {
    background: #ffffff10;
    border: 1px solid #ffffff28;
    border-radius: 6px;
    color: white;
    cursor: pointer;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    padding: 0.35em 0.75em;
    white-space: nowrap;
   }

   .lane-modal-action--open:hover,
   .lane-modal-action--open:focus {
    background: #9ce5ff26;
    border-color: #9ce5ff66;
    color: #d6f5ff;
   }

   .lane-modal-action--close {
    background: transparent;
    color: #ffffff99;
   }
