<!doctype html>
<html lang="en">
 <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Civil Command</title>
  <meta name="description" content="Multi-lane FieldScript workspace and live notebook environment.">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Civil Command">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180">
  <style>
   :root {
    --scrollbar-color: #383838 transparent;
    --scrollbar-thumb-color: #383838;
    --scrollbar-track-color: transparent;
    background-color: black;
    box-sizing: border-box;
    color: white;
    display: grid;
    min-height: 100dvh;
    min-width: 100%;
    overflow: auto;
    padding: calc(16px + 1em) 1em 1em;
    scroll-padding-inline: 48px 96px;
    scrollbar-color: var(--scrollbar-color);
    width: fit-content;
    align-content: start;
    justify-content: start;
   }
   @supports not (scrollbar-color: #383838 transparent) {
    ::-webkit-scrollbar {
     height: 10px;
     width: 10px;
    }
    ::-webkit-scrollbar-track {
     background: var(--scrollbar-track-color, transparent);
    }
    ::-webkit-scrollbar-thumb {
     background-color: var(--scrollbar-thumb-color, #383838);
     border-radius: 5px;
    }
   }
   body {
    background-color: #202020;
    box-sizing: border-box;
    font-family: "IBM Plex Mono", monospace, Arial, "Noto Sans", Verdana, sans-serif;
    font-size: 13px;
    margin-top: auto;
    margin-right: 64px;
    margin-bottom: auto;
    margin-left: 64px;
    padding: 0.75em 1em;
    min-height: 1em;
    min-width: 1em;
    width: max-content;
    border-radius: 1em;
    border: 1px solid #20202020;
    box-shadow: 0 0 0.25em #00000040, inset -2px -2px 20px #ffffff04, inset -1px -1px 10px #ffffff08, inset 4px 4px 4px #00000080, inset 2px 2px 2px #00000040;
   }
   
   body * {
    white-space: pre-wrap;
   }

   [hidden] {
    display: none !important;
   }
   
   body *::selection {
    background: #ffffff80;
    color: black;
   }

   .lanes-table {
    border-collapse: collapse;
   }

   .lanes-table thead th {
    vertical-align: top;
   }

   .lanes-table thead th:first-child {
    padding: 0;
   }

   .lane-controls {
    display: flex;
    gap: 0.35em;
    padding: 0.25em 0.5em 0.25em 0;
    white-space: nowrap;
   }

   .lane-control-btn {
    align-items: center;
    background: #ffffff0e;
    border: 1px solid #ffffff24;
    border-radius: 4px;
    box-sizing: border-box;
    color: white;
    cursor: pointer;
    display: inline-flex;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    justify-content: center;
    line-height: 1.25;
    padding: 0.3em 0.65em;
    white-space: nowrap;
   }

   .lane-control-btn:hover,
   .lane-control-btn:focus {
    background: #ffffff1e;
    border-color: #ffffff48;
   }

   .lane-config-btn {
    flex-shrink: 0;
    min-height: calc(1.25em + 0.6em + 2px);
    padding: 0.3em 0.5em;
   }

   .lane-config-icon {
    display: block;
    height: 1.05em;
    width: 1.05em;
   }

   .lane-header {
    border-bottom: 1px solid #ffffff18;
    border-left: 1px solid #ffffff12;
    border-right: 1px solid #ffffff12;
    min-width: 24em;
    position: relative;
    scroll-margin-inline: 48px 96px;
   }

   .lane-header--sized {
    box-sizing: border-box;
    max-width: max(100px, var(--lane-width));
    min-width: 100px;
    width: max(100px, var(--lane-width));
   }

   .lane-header--sized > .lane-header-top {
    box-sizing: border-box;
    min-width: 0;
    overflow-x: auto;
    width: calc(max(100px, var(--lane-width)) - 1.5em - 1px);
   }

   .lane-header-top {
    align-items: flex-start;
    display: flex;
    gap: 0.45em;
    justify-content: space-between;
    white-space: normal;
   }

   .lane-header-meta {
    flex: 1;
    min-width: 0;
   }

   .lane-copy-btn,
   .lane-min-btn,
   .lane-reload-btn,
   .lane-fullscreen-btn,
   .lane-close-btn {
    align-items: center;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 4px;
    color: #ffffff88;
    cursor: pointer;
    display: inline-flex;
    flex-shrink: 0;
    font-family: "IBM Plex Mono", monospace;
    font-size: 14px;
    justify-content: center;
    line-height: 1;
    opacity: 0.55;
    padding: 0.15em 0.35em;
    white-space: nowrap;
   }

   .lane-copy-icon,
   .lane-min-icon,
   .lane-fullscreen-icon {
    display: block;
    height: 1em;
    width: 1em;
   }

   .lane-copy-btn:hover,
   .lane-copy-btn:focus,
   .lane-min-btn:hover,
   .lane-min-btn:focus,
   .lane-reload-btn:hover,
   .lane-reload-btn:focus,
   .lane-fullscreen-btn:hover,
   .lane-fullscreen-btn:focus,
   .lane-fullscreen-btn--active,
   .lane-fullscreen-btn--active:hover,
   .lane-fullscreen-btn--active:focus {
    background: #9ce5ff1e;
    border-color: #9ce5ff50;
    color: #d6f5ff;
    opacity: 1;
   }

   .lane-copy-btn--copied,
   .lane-copy-btn--copied:hover,
   .lane-copy-btn--copied:focus {
    background: #52e08522;
    border-color: #52e08566;
    color: #98f5b8;
    opacity: 1;
   }

   .lane-close-btn:hover,
   .lane-close-btn:focus {
    background: #ff555524;
    border-color: #ff555550;
    color: #ff9c9c;
    opacity: 1;
   }

   .lane-body {
    border-left: 1px solid #ffffff12;
    border-right: 1px solid #ffffff12;
    padding: 0.4em 0.5em 0.75em;
    position: relative;
    scroll-margin-inline: 48px 96px;
    vertical-align: top;
   }

   .lane-header--highlighted,
   .lane-body--highlighted {
    animation: lane-highlight-pulse 2.2s ease-out;
    background: #38d39f14;
    border-left-color: #38d39f88;
    border-right-color: #38d39f88;
   }

   .lane-header--highlighted {
    animation-name: lane-header-highlight-pulse;
    box-shadow: inset 0 1px 0 0 #38d39f66, inset 1px 0 0 0 #38d39f66, inset -1px 0 0 0 #38d39f66;
   }

   .lane-body--highlighted {
    animation-name: lane-body-highlight-pulse;
    box-shadow: inset 0 -1px 0 0 #38d39f66, inset 1px 0 0 0 #38d39f66, inset -1px 0 0 0 #38d39f66;
   }

   @keyframes lane-header-highlight-pulse {
    0% {
     background: #38d39f30;
     box-shadow: inset 0 2px 0 0 #38d39fbb, inset 2px 0 0 0 #38d39fbb, inset -2px 0 0 0 #38d39fbb;
    }
    100% {
     background: #38d39f00;
     box-shadow: inset 0 1px 0 0 #38d39f00, inset 1px 0 0 0 #38d39f00, inset -1px 0 0 0 #38d39f00;
    }
   }

   @keyframes lane-body-highlight-pulse {
    0% {
     background: #38d39f30;
     box-shadow: inset 0 -2px 0 0 #38d39fbb, inset 2px 0 0 0 #38d39fbb, inset -2px 0 0 0 #38d39fbb;
    }
    100% {
     background: #38d39f00;
     box-shadow: inset 0 -1px 0 0 #38d39f00, inset 1px 0 0 0 #38d39f00, inset -1px 0 0 0 #38d39f00;
    }
   }

   .lane-body--sized {
    box-sizing: border-box;
    max-width: max(100px, var(--lane-width));
    min-width: 100px;
    width: max(100px, var(--lane-width));
   }

   .lane-body--sized > .lane-notebook,
   .lane-body--sized > .lane-output {
    box-sizing: border-box;
    min-width: 0;
    overflow-x: auto;
    width: calc(max(100px, var(--lane-width)) - 1em - 1px);
   }

   .lane-body--sized .lane-tab-panel,
   .lane-body--sized .lane-data,
   .lane-body--sized .lane-data-active,
   .lane-body--sized .lane-data-rows-section,
   .lane-body--sized .lane-scope,
   .lane-body--sized .lane-story {
    min-width: 0;
    width: 100%;
   }

   .lane-body--sized .lane-scope-columns,
   .lane-body--sized .lane-data-grid-wrap,
   .lane-body--sized .lane-story-scroller {
    box-sizing: border-box;
    max-width: 100%;
    min-width: 0;
    width: 100%;
   }

   .lane-resizer {
    bottom: 0;
    cursor: ew-resize;
    position: absolute;
    right: -4px;
    top: 0;
    touch-action: none;
    user-select: none;
    width: 8px;
    z-index: 3;
   }

   .lane-resizer::after {
    background: transparent;
    bottom: 0;
    content: "";
    left: 3px;
    position: absolute;
    top: 0;
    transition: background-color 120ms ease;
    width: 2px;
   }

   .lane-resizer:hover::after,
   .lane-resizer--hover::after,
   .lane-resizer--active::after {
    background: #9ce5ffaa;
   }

   .lane-notebook {
    display: flex;
    flex-direction: column;
    gap: 0.4em;
    min-width: 24em;
   }

   .lane-tabs {
    border-bottom: 1px solid #ffffff18;
    display: flex;
    gap: 0.25em;
    margin-bottom: 0.1em;
    padding-bottom: 0.25em;
    white-space: nowrap;
   }

   .lane-tab {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 4px;
    color: #ffffff80;
    cursor: pointer;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    line-height: 1.25;
    padding: 0.25em 0.6em;
    white-space: nowrap;
   }

   .lane-tab:hover,
   .lane-tab:focus {
    background: #ffffff10;
    color: white;
   }

   .lane-tab--active {
    background: #9ce5ff1a;
    border-color: #9ce5ff44;
    color: #d6f5ff;
   }

   .lane-tab-panel {
    display: flex;
    flex-direction: column;
    gap: 0.3em;
    white-space: normal;
   }

   .lane-tab-panel[hidden],
   .lane-inputs-empty[hidden] {
    display: none;
   }

   .lane-inputs {
    display: flex;
    flex-direction: column;
    gap: 0.35em;
    white-space: normal;
   }

   .lane-inputs-table {
    border-collapse: collapse;
    width: 100%;
    white-space: normal;
   }

   .lane-inputs-th {
    border-bottom: 1px solid #ffffff16;
    color: #ffffff78;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    font-weight: normal;
    padding: 0.2em 0.35em 0.3em;
    text-align: left;
    white-space: nowrap;
   }

   .lane-inputs-th--actions {
    width: 1.8em;
   }

   .lane-input-cell {
    padding: 0.2em 0.25em 0.2em 0;
    vertical-align: middle;
    white-space: normal;
   }

   .lane-input-cell--actions {
    padding-right: 0;
    text-align: right;
   }

   .lane-input-name,
   .lane-input-type {
    background: #ffffff08;
    border: 1px solid #ffffff16;
    border-radius: 4px;
    box-sizing: border-box;
    color: white;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    outline: none;
    padding: 0.25em 0.45em;
    width: 100%;
   }

   .lane-input-name {
    white-space: pre;
   }

   .lane-input-type {
    background-color: #1c1c1c;
    cursor: pointer;
    min-width: 7.5em;
    white-space: nowrap;
   }

   .lane-input-type option {
    background-color: #1c1c1c;
    color: white;
   }

   .lane-input-name:focus,
   .lane-input-type:focus,
   .lane-input-secret-input:focus {
    background-color: #252525;
    border-color: #ffffff44;
   }

   .lane-input-type:disabled {
    cursor: not-allowed;
    opacity: 0.65;
   }

   .lane-input-secret-box {
    align-items: center;
    display: flex;
    gap: 0.35em;
    margin-top: 0.3em;
    white-space: normal;
   }

   .lane-input-secret-box[hidden],
   .lane-input-secret-input[hidden],
   .lane-input-secret-set[hidden],
   .lane-input-secret-locked[hidden] {
    display: none;
   }

   .lane-input-secret-input {
    background: #ffffff08;
    border: 1px solid #ffffff16;
    border-radius: 4px;
    box-sizing: border-box;
    color: white;
    flex: 1 1 auto;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    min-width: 8em;
    outline: none;
    padding: 0.25em 0.45em;
    width: 100%;
   }

   .lane-input-secret-set {
    background: #9ce5ff1a;
    border: 1px solid #9ce5ff55;
    border-radius: 4px;
    color: #d6f5ff;
    cursor: pointer;
    flex-shrink: 0;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    line-height: 1;
    padding: 0.32em 0.6em;
    white-space: nowrap;
   }

   .lane-input-secret-set:hover,
   .lane-input-secret-set:focus {
    background: #9ce5ff2e;
    border-color: #9ce5ff88;
    color: white;
    outline: none;
   }

   .lane-input-secret-locked {
    background: #27c93f14;
    border: 1px solid #27c93f44;
    border-radius: 4px;
    color: #8df59d;
    display: inline-block;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    padding: 0.22em 0.5em;
    user-select: none;
    white-space: nowrap;
   }

   .lane-inputs-empty {
    color: #ffffff58;
    font-size: 11px;
    padding: 0.35em 0.25em;
    white-space: normal;
   }

   .lane-input-remove,
   .lane-add-input {
    background: transparent;
    border: 1px solid #ffffff1c;
    border-radius: 4px;
    color: #ffffff90;
    cursor: pointer;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    line-height: 1;
    padding: 0.25em 0.45em;
    white-space: nowrap;
   }

   .lane-input-remove {
    border-color: transparent;
    opacity: 0.45;
   }

   .lane-input-remove:hover,
   .lane-input-remove:focus {
    background: #ff555524;
    border-color: #ff555550;
    color: #ff9c9c;
    opacity: 1;
   }

   .lane-add-input {
    align-self: flex-start;
    margin-top: 0.1em;
   }

   .lane-add-input:hover,
   .lane-add-input:focus {
    background: #ffffff14;
    border-color: #ffffff38;
    color: white;
   }

   .lane-scope {
    display: flex;
    flex-direction: column;
    gap: 0.35em;
    white-space: normal;
   }

   .lane-scope-toolbar {
    align-items: center;
    display: flex;
    gap: 0.35em;
    white-space: nowrap;
   }

   .lane-scope-filter-wrap {
    align-items: center;
    background: #00000038;
    border: 1px solid #ffffff1a;
    border-radius: 5px;
    display: flex;
    flex: 1;
    gap: 0.25em;
    min-width: 0;
    padding: 0.12em 0.35em;
   }

   .lane-scope-filter-wrap:focus-within {
    border-color: #9ce5ff66;
    background: #00000052;
   }

   .lane-scope-filter-input {
    background: transparent;
    border: none;
    color: #ffffffe6;
    flex: 1;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    min-width: 0;
    outline: none;
    padding: 0.16em 0.1em;
   }

   .lane-scope-filter-input::placeholder {
    color: #ffffff4d;
   }

   .lane-scope-filter-count {
    color: #9ce5ffcc;
    flex-shrink: 0;
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    white-space: nowrap;
   }

   .lane-scope-filter-clear {
    background: transparent;
    border: none;
    border-radius: 3px;
    color: #ffffff77;
    cursor: pointer;
    flex-shrink: 0;
    font-family: inherit;
    font-size: 12px;
    line-height: 1;
    padding: 0.1em 0.25em;
   }

   .lane-scope-filter-clear:hover,
   .lane-scope-filter-clear:focus {
    background: #ffffff18;
    color: #ffffff;
   }

   .lane-scope-proto-btn {
    background: #ffffff08;
    border: 1px solid #ffffff1c;
    border-radius: 5px;
    color: #ffffff66;
    cursor: pointer;
    flex-shrink: 0;
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    padding: 0.28em 0.5em;
    white-space: nowrap;
   }

   .lane-scope-proto-btn:hover,
   .lane-scope-proto-btn:focus {
    background: #ffffff14;
    color: #ffffffcc;
   }

   .lane-scope-proto-btn--active {
    background: #9ce5ff18;
    border-color: #9ce5ff44;
    color: #9ce5ff;
   }

   .lane-scope-breadcrumb {
    align-items: center;
    background: #ffffff07;
    border: 1px solid #ffffff14;
    border-radius: 5px;
    display: flex;
    gap: 0.35em;
    justify-content: space-between;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    padding: 0.25em 0.45em;
    white-space: normal;
   }

   .lane-scope-crumb-list {
    align-items: center;
    display: flex;
    flex: 1;
    flex-wrap: wrap;
    gap: 0.1em;
    min-width: 0;
   }

   .lane-scope-copy-btn {
    background: #ffffff0d;
    border: 1px solid #ffffff1e;
    border-radius: 3px;
    color: #ffffffaa;
    cursor: pointer;
    flex-shrink: 0;
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    padding: 0.12em 0.45em;
    white-space: nowrap;
   }

   .lane-scope-copy-btn:hover,
   .lane-scope-copy-btn:focus {
    background: #9ce5ff22;
    border-color: #9ce5ff55;
    color: #d6f5ff;
   }

   .lane-scope-crumb {
    background: transparent;
    border: none;
    border-radius: 3px;
    color: #9ce5ff;
    cursor: pointer;
    font-family: inherit;
    font-size: inherit;
    padding: 0.1em 0.25em;
    white-space: nowrap;
   }

   .lane-scope-crumb:hover,
   .lane-scope-crumb:focus {
    background: #9ce5ff1f;
    color: #d6f5ff;
   }

   .lane-scope-crumb-sep {
    color: #ffffff55;
    user-select: none;
    white-space: pre;
   }

   .lane-scope-columns {
    background: #00000038;
    border: 1px solid #ffffff16;
    border-radius: 6px;
    display: flex;
    flex-direction: row;
    max-height: 22em;
    max-width: 44em;
    min-height: 11em;
    overflow-x: auto;
    overflow-y: hidden;
    white-space: normal;
   }

   .lane-scope-col {
    border-right: 1px solid #ffffff14;
    box-sizing: border-box;
    display: flex;
    flex: 0 0 auto;
    flex-direction: column;
    max-height: 22em;
    max-width: 16em;
    min-width: 11.5em;
    white-space: normal;
   }

   .lane-scope-col:last-child {
    border-right: none;
   }

   .lane-scope-col--value {
    max-width: 22em;
    min-width: 13em;
   }

   .lane-scope-col-header {
    align-items: center;
    background: #ffffff08;
    border-bottom: 1px solid #ffffff14;
    display: flex;
    flex-shrink: 0;
    gap: 0.4em;
    justify-content: space-between;
    padding: 0.3em 0.55em;
    white-space: nowrap;
   }

   .lane-scope-col-title {
    color: #ffffffd8;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    font-weight: bold;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
   }

   .lane-scope-col-meta,
   .lane-scope-type-badge {
    background: #ffffff10;
    border-radius: 3px;
    color: #ffffff88;
    flex-shrink: 0;
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    padding: 0.1em 0.35em;
    white-space: nowrap;
   }

   .lane-scope-type-badge {
    background: #9ce5ff1a;
    color: #9ce5ff;
   }

   .lane-scope-col-meta--filtered {
    background: #9ce5ff1f;
    color: #9ce5ff;
   }

   .lane-scope-col-banner {
    background: #00000030;
    border-bottom: 1px solid #ffffff10;
    color: #9ce5ff;
    flex-shrink: 0;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    overflow: hidden;
    padding: 0.25em 0.55em;
    text-overflow: ellipsis;
    white-space: nowrap;
   }

   .lane-scope-list {
    display: flex;
    flex: 1;
    flex-direction: column;
    overflow-y: auto;
    padding: 0.2em 0;
    white-space: normal;
   }

   .lane-scope-empty {
    color: #ffffff55;
    font-size: 11px;
    padding: 0.5em 0.6em;
    white-space: normal;
   }

   .lane-scope-divider {
    border-top: 1px solid #ffffff12;
    color: #ffffff44;
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    margin-top: 0.25em;
    padding: 0.25em 0.55em 0.15em;
    text-transform: uppercase;
    user-select: none;
    white-space: nowrap;
   }

   .lane-scope-item {
    align-items: center;
    background: transparent;
    border: none;
    color: #ffffffde;
    cursor: pointer;
